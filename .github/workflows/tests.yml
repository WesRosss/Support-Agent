name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installeer dependencies
        run: pip install -r requirements-dev.txt
      - name: Compileer alle Python-bestanden
        run: python -m py_compile app/*.py tests/*.py windows-client/support_agent.py
      - name: Draai server tests
        run: python -m pytest tests/ -q
